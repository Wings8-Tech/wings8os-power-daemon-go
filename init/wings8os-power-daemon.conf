description   "Start the Wings8OS power daemon"

start on started powerd
stop on stopping boot-services

oom score -100

script
  # Execute the power daemon and redirect logs to a temporary file
  exec /usr/sbin/power_daemon > /tmp/wings8os_powerd.log
end script